[project]
name = "resbud-api"
version = "0.1.0"
description = "Resbud FastAPI backend"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1",
    "openai>=2,<3",
    "python-docx>=1.2,<2",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5.0",
    "mypy>=1.15,<2.0",
    "openapi-spec-validator>=0.7,<1.0",
    "pytest>=8.3,<9.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resbud_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
packages = ["resbud_api"]
